<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KBG — Nouveau mot de passe</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .reset-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .reset-card {
      width: min(520px, 100%);
      padding: 32px;
    }

    .reset-card input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    .reset-card .button {
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <main class="reset-wrap">

    <section class="panel reset-card">

      <p class="eyebrow">COMPTE KBG</p>

      <h1>Nouveau mot de passe</h1>

      <p id="resetStatus" class="form-message">
        Vérification du lien de récupération…
      </p>


      <!-- =====================================================
           FORMULAIRE DE NOUVEAU MOT DE PASSE
           ===================================================== -->

      <form
        id="resetForm"
        class="hidden"
        style="margin-top:20px;"
      >

        <input
          id="newPassword"
          type="password"
          minlength="6"
          required
          placeholder="Nouveau mot de passe"
        >

        <input
          id="newPasswordConfirm"
          type="password"
          minlength="6"
          required
          placeholder="Confirmer le nouveau mot de passe"
        >

        <button
          class="button primary"
          type="submit"
        >
          Modifier mon mot de passe
        </button>

      </form>


      <!-- =====================================================
           RETOUR AU CATALOGUE
           ===================================================== -->

      <p style="margin-top:20px;">

        <a
          href="#"
          id="backToCatalog"
        >
          ← Retour au catalogue
        </a>

      </p>

    </section>

  </main>


  <!-- =========================================================
       SUPABASE
       ========================================================= -->

  <script type="module">

    import {
      createClient
    } from 'https://esm.sh/@supabase/supabase-js@2';


    const SUPABASE_URL =
      'https://qqelmmygalllmxinaxrf.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_fqFvZNetzIdAfX860bmjBQ_GzJfeVK3';


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // =========================================================
    // ÉLÉMENTS HTML
    // =========================================================

    const status =
      document.getElementById('resetStatus');

    const form =
      document.getElementById('resetForm');

    const backToCatalog =
      document.getElementById('backToCatalog');


    // =========================================================
    // MESSAGE
    // =========================================================

    function setStatus(
      message,
      type = ''
    ) {

      status.textContent =
        message;


      if (type === 'success') {

        status.style.color =
          'var(--success)';

      }

      else if (type === 'error') {

        status.style.color =
          'var(--danger)';

      }

      else {

        status.style.color =
          'var(--muted)';

      }

    }


    // =========================================================
    // AFFICHAGE DU FORMULAIRE
    // =========================================================

    function showRecoveryForm() {

      setStatus(
        'Choisissez votre nouveau mot de passe.'
      );

      form.classList.remove('hidden');

    }


    // =========================================================
    // NETTOYAGE COMPLET DE LA SESSION DE RÉCUPÉRATION
    // =========================================================

    async function leaveRecoveryPage() {

      try {
        // "global" révoque aussi le refresh token côté serveur :
        // après un reset de mot de passe on veut invalider la
        // session de récupération partout, pas seulement ici.
        await supabase.auth.signOut({
          scope: 'global'
        });
      } catch (error) {
        console.error(
          'Erreur Supabase lors du nettoyage de la session :',
          error
        );
      }

      // Sécurité supplémentaire : on vide TOUT le localStorage
      // et sessionStorage de ce domaine (le site ne stocke rien
      // d'autre que la session Supabase), pour ne dépendre
      // d'aucun nom de clé précis.
      try {
        localStorage.clear();
        sessionStorage.clear();
      } catch (error) {
        console.error(
          'Erreur lors du nettoyage du stockage local :',
          error
        );
      }

      // Vérification finale : si getSession() renvoie encore une
      // session (cas limite / timing), on force un nouveau
      // nettoyage avant de partir.
      let leftoverSession = null;

      try {
        const {
          data: { session }
        } = await supabase.auth.getSession();

        leftoverSession = session;

        if (session) {
          await supabase.auth.signOut({ scope: 'local' });
          localStorage.clear();
          sessionStorage.clear();
        }
      } catch (error) {
        console.error(
          'Erreur lors de la vérification finale de session :',
          error
        );
      }

      // =====================================================
      // MODE DIAGNOSTIC TEMPORAIRE
      //
      // Affiche à l'écran (pas besoin des DevTools) si une
      // session traînait encore juste avant de quitter cette
      // page. À retirer une fois le bug identifié.
      // =====================================================

      if (leftoverSession) {

        setStatus(
          '⚠️ DEBUG : une session existait encore juste avant la redirection (' +
          (leftoverSession.user?.email || 'email inconnu') +
          '). Nouveau nettoyage effectué, redirection dans 4s…',
          'error'
        );

        await new Promise((resolve) => setTimeout(resolve, 4000));

      } else {

        setStatus(
          '✅ DEBUG : aucune session détectée avant la redirection. Redirection dans 2s…'
        );

        await new Promise((resolve) => setTimeout(resolve, 2000));

      }

      // replace évite de conserver reset_password.html dans
      // l'historique de navigation. Le paramètre loggedout=1
      // évite aussi qu'une version mise en cache de la page ne
      // soit servie par le navigateur.
      window.location.replace(
        'index.html?loggedout=1'
      );
    }


    // =========================================================
    // RETOUR AU CATALOGUE
    // =========================================================

    backToCatalog?.addEventListener(
      'click',
      async (event) => {

        event.preventDefault();

        await leaveRecoveryPage();

      }
    );


    // =========================================================
    // INITIALISATION
    // =========================================================

    async function init() {

      const hash =
        window.location.hash || '';

      const search =
        window.location.search || '';


      // -------------------------------------------------------
      // LIEN DE RÉCUPÉRATION CLASSIQUE
      // -------------------------------------------------------

      const isRecoveryLink =
        /(?:^|[&#?])type=recovery(?:&|$)/i.test(hash) ||
        /(?:^|[&#?])type=recovery(?:&|$)/i.test(search);


      // -------------------------------------------------------
      // PKCE
      //
      // Certains liens Supabase utilisent :
      //
      // ?code=...
      // -------------------------------------------------------

      const code =
        new URLSearchParams(search).get('code');


      if (code) {

        const {
          error
        } =
          await supabase.auth.exchangeCodeForSession(
            code
          );


        if (error) {

          console.error(
            'Erreur échange du lien de récupération :',
            error
          );


          setStatus(
            'Ce lien de récupération est invalide, expiré ou a déjà été utilisé.',
            'error'
          );

          return;

        }


        showRecoveryForm();

        return;

      }


      // -------------------------------------------------------
      // LIEN AVEC type=recovery
      // -------------------------------------------------------

      if (isRecoveryLink) {

        const {
          data: {
            session
          }
        } =
          await supabase.auth.getSession();


        if (session) {

          showRecoveryForm();

        }

        else {

          setStatus(
            'Ouverture du lien de récupération…'
          );

        }

        return;

      }


      // -------------------------------------------------------
      // PAS DE LIEN DE RÉCUPÉRATION
      // -------------------------------------------------------

      setStatus(
        'Ouvrez cette page depuis le lien reçu par e-mail.',
        'error'
      );

    }


    // =========================================================
    // ÉVÉNEMENT SUPABASE
    // =========================================================

    supabase.auth.onAuthStateChange(
      (event, session) => {

        if (
          event === 'PASSWORD_RECOVERY' &&
          session
        ) {

          showRecoveryForm();

        }

      }
    );


    // =========================================================
    // MODIFICATION DU MOT DE PASSE
    // =========================================================

    form.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();


        const password =
          document.getElementById(
            'newPassword'
          ).value;


        const confirmation =
          document.getElementById(
            'newPasswordConfirm'
          ).value;


        const button =
          form.querySelector(
            'button[type="submit"]'
          );


        // -----------------------------------------------------
        // VÉRIFICATION LONGUEUR
        // -----------------------------------------------------

        if (password.length < 6) {

          setStatus(
            'Le mot de passe doit contenir au moins 6 caractères.',
            'error'
          );

          return;

        }


        // -----------------------------------------------------
        // VÉRIFICATION CONFIRMATION
        // -----------------------------------------------------

        if (password !== confirmation) {

          setStatus(
            'Les deux mots de passe ne correspondent pas.',
            'error'
          );

          return;

        }


        button.disabled = true;


        setStatus(
          'Modification du mot de passe…'
        );


        try {

          // ---------------------------------------------------
          // MODIFICATION
          // ---------------------------------------------------

          const {
            error
          } =
            await supabase.auth.updateUser({
              password
            });


          if (error) {

            throw error;

          }


          // ---------------------------------------------------
          // SUCCÈS
          // ---------------------------------------------------

          form.reset();


          setStatus(
            '✓ Votre mot de passe a été modifié. Vous pouvez maintenant vous connecter.',
            'success'
          );


          // ---------------------------------------------------
          // IMPORTANT :
          //
          // On détruit la session de récupération avant de
          // retourner au catalogue.
          //
          // Sinon index.html détecterait un utilisateur
          // connecté.
          // ---------------------------------------------------

          setTimeout(
            async () => {

              await leaveRecoveryPage();

            },
            1800
          );

        }


        catch (error) {

          console.error(
            'Erreur changement mot de passe :',
            error
          );


          setStatus(
            'Erreur : ' +
            (error?.message || error),
            'error'
          );


          button.disabled =
            false;

        }

      }
    );


    // =========================================================
    // LANCEMENT
    // =========================================================

    init();

  </script>

</body>
</html>
