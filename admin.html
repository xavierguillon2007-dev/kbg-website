<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KBG — Administration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-mark">K</span><span>KBG<span class="muted">/</span> ADMIN</span></a>
    <nav>
      <a href="index.html">← Retour au catalogue</a>
      <div id="userNav" class="user-nav"></div>
    </nav>
  </header>

  <main>
    <section class="hero hero-admin">
      <div>
        <p class="eyebrow">GESTION · BACKOFFICE</p>
        <h1>Espace <span>administration.</span></h1>
        <p class="hero-copy">Gérez les demandes de réservation des membres et modifiez le statut des emprunts en temps réel.</p>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <p class="eyebrow">RÉSERVATIONS</p>
          <h2>Demandes d'emprunt</h2>
        </div>
        <div class="toolbar-inline">
          <select id="filterStatus">
            <option value="">Tous les statuts</option>
            <option value="pending" selected>En attente</option>
            <option value="approved">Validées</option>
            <option value="rejected">Refusées</option>
          </select>
        </div>
      </div>

      <div id="adminReservationsList" class="grid admin-grid">
        <div class="loading">Chargement des données Supabase…</div>
      </div>
    </section>
  </main>

  <footer>
    <span>KBG / Association ludique</span>
    <span>Panneau d'administration</span>
  </footer>

  <script type="module" src="admin.js"></script>
</body>
</html>
