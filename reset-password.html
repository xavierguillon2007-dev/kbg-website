<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KBG — Nouveau mot de passe</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-wrap {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .reset-card {
      width: min(520px, 100%);
      padding: 32px;
    }
    .reset-card input {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .reset-card .button {
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <main class="reset-wrap">
    <section class="panel reset-card">
      <p class="eyebrow">COMPTE KBG</p>
      <h1>Nouveau mot de passe</h1>
      <p id="resetStatus" class="form-message">
        Vérification du lien de récupération…
      </p>

      <form id="resetForm" class="hidden" style="margin-top:20px;">
        <input
          id="newPassword"
          type="password"
          minlength="6"
          required
          placeholder="Nouveau mot de passe"
        >

        <input
          id="newPasswordConfirm"
          type="password"
          minlength="6"
          required
          placeholder="Confirmer le nouveau mot de passe"
        >

        <button class="button primary" type="submit">
          Modifier mon mot de passe
        </button>
      </form>

      <p style="margin-top:20px;">
        <a href="index.html">← Retour au catalogue</a>
      </p>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://qqelmmygalllmxinaxrf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_fqFvZNetzIdAfX860bmjBQ_GzJfeVK3';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const status = document.getElementById('resetStatus');
    const form = document.getElementById('resetForm');

    function setStatus(message, type = '') {
      status.textContent = message;
      if (type === 'success') status.style.color = 'var(--success)';
      else if (type === 'error') status.style.color = 'var(--danger)';
      else status.style.color = 'var(--muted)';
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        setStatus(
          'Ce lien de récupération est invalide, expiré ou a déjà été utilisé.',
          'error'
        );
        return;
      }

      setStatus('Choisissez votre nouveau mot de passe.');
      form.classList.remove('hidden');
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        setStatus('Choisissez votre nouveau mot de passe.');
        form.classList.remove('hidden');
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('newPasswordConfirm').value;
      const button = form.querySelector('button[type="submit"]');

      if (password.length < 6) {
        setStatus(
          'Le mot de passe doit contenir au moins 6 caractères.',
          'error'
        );
        return;
      }

      if (password !== confirmation) {
        setStatus(
          'Les deux mots de passe ne correspondent pas.',
          'error'
        );
        return;
      }

      button.disabled = true;
      setStatus('Modification du mot de passe…');

      try {
        const { error } = await supabase.auth.updateUser({
          password
        });

        if (error) throw error;

        form.reset();
        setStatus(
          '✓ Votre mot de passe a été modifié. Vous pouvez maintenant vous connecter.',
          'success'
        );

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1800);

      } catch (error) {
        console.error('Erreur changement mot de passe :', error);
        setStatus(
          'Erreur : ' + (error?.message || error),
          'error'
        );
        button.disabled = false;
      }
    });

    init();
  </script>
</body>
</html>
